<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSaver - Identify Books with Your Camera{% endblock %}</title>
    <meta name="description" content="Upload a photo of books to instantly identify them and get purchase links.">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #1a365d; /* Navy text */
            background-color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1, h2, h3 {
            color: #1a365d;
            margin-bottom: 10px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 20px;
            min-height: 600px;
        }
        
        .upload-section, .results-section {
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            background: #f7fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
        }
        
        .upload-area:hover,
        .upload-area.dragover {
            border-color: #4299e1;
            background: #ebf8ff;
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .upload-btn {
            background: #1a365d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            background: #2d3748;
        }
        
        .preview-section {
            margin: 20px 0;
        }
        
        .preview-container {
            position: relative;
            text-align: center;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .clear-btn {
            position: absolute;
            top: -10px;
            right: 10px;
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
        
        .clear-btn:hover {
            background: #c53030;
        }
        
        .scan-btn {
            width: 100%;
            background: #1a365d;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .scan-btn:hover:not(:disabled) {
            background: #2d3748;
        }
        
        .scan-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .instructions {
            margin-top: 30px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 4px;
            border-left: 4px solid #1a365d;
        }
        
        .instructions h4 {
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .instructions ul {
            list-style-position: inside;
            font-size: 13px;
            color: #4a5568;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
        
        .error {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #feb2b2;
        }
        
        /* Books grid styles */
        .books-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .book-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }
        
        .book-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #1a365d;
        }
        
        .book-authors {
            color: #4a5568;
            font-style: italic;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .book-actions {
            margin-top: 15px;
        }
        
        .purchase-links, .reader-links {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .retailer-btn {
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            color: white;
            display: inline-block;
        }
        
        /* Purchase button colors */
        .amazon-btn { background: #ff9900; opacity: 0.6}
        .audible-btn { background: #f46500; opacity: 0.6}
        .bn-btn { background: #00704a; opacity: 0.6}
        .bookshop-btn { background: #664228; opacity: 0.6}
        .google-btn { background: #4285f4; opacity: 0.6}
        
        /* Reader app button colors */
        .goodreads-btn { background: #8b4513; opacity: 0.6}
        .storygraph-btn { background: #ff6b6b; opacity: 0.6}
        .overdrive-btn { background: #003d7a; opacity: 0.6}
        .librarything-btn { background: #228b22; opacity: 0.6}
        
        .retailer-btn:hover {
            opacity: 0.8;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            body {
                padding: 10px;
            }
            
            .upload-area {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">Booksaver</a></h1>
            <p>Identify books instantly with your camera!</p>
        </header>
        
        <main>
            {% block content %}{% endblock %}
        </main>
        
        <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 12px; color: #718096;">
            <p>&copy; 2025 Booksaver. Made with ❤️ for book lovers.</p>
        </footer>
    </div>
</body>
</html>
