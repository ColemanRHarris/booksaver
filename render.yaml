services:
  # Main Flask web application
  - type: web
    name: booksaver-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DEBUG_ERRORS
        value: "true"  # Set to "true" to see technical errors in production
      - key: GEMINI_API_KEY
        sync: false  # You'll set this manually in Render dashboard
      - key: GOOGLE_BOOKS_KEY
        sync: false  # You'll set this manually in Render dashboard
    healthCheckPath: /health