[project]
name = "booksaver"
version = "0.1.0"
description = "BookSaver - Identify books with your camera"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.1",
    "fuzzywuzzy>=0.18.0",
    "gunicorn>=23.0.0",
    "python-levenshtein>=0.25.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "flask-limiter>=3.12",
    "google-genai>=1.31.0",
    "pillow>=10.0.0",
    "langdetect>=1.0.9",
    "psutil>=5.9.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.5",
    "stripe>=7.9.0",
    "email-validator>=2.1.0",
    "sendgrid>=6.11.0",
]

[dependency-groups]
dev = [
    "faker>=40.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-flask>=1.3.0",
    "pytest-mock>=3.15.1",
    "python-dateutil>=2.9.0.post0",
]
